<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pantry Recipe Generator</title>
    <!-- Modern Styling via Bootstrap Framework -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Your Custom Stylesheet Link -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container py-5">
        <!-- Header -->
        <div class="p-5 text-center accent-header mb-4">
            <h1 class="display-5 fw-bold">🍳 Smart Pantry</h1>
            <p class="lead">Select the ingredients in your fridge to see what you can cook right now!</p>
        </div>

        <div class="row g-4">
            <!-- Left Side: Ingredient Selection -->
            <div class="col-md-4">
                <div class="card p-4">
                    <h4 class="mb-3 text-secondary">Your Fridge</h4>
                    <div id="ingredients-container">
                        <!-- JavaScript will insert checkboxes here -->
                    </div>
                    <button onclick="findRecipes()" class="btn btn-primary w-100 mt-3 py-2 fw-bold">Find Recipes</button>
                </div>
            </div>

            <!-- Right Side: Recipe Results -->
            <div class="col-md-8">
                <div class="card p-4 h-100">
                    <h4 class="mb-4 text-secondary">Matching Recipes</h4>
                    <div id="recipes-output">
                        <div class="text-center py-5 text-muted">
                            <p class="fs-5">Select ingredients and click "Find Recipes"</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Your Custom JavaScript Logic Link -->
    <script src="script.js"></script>
</body>
</html>
